<title>全球金融風險看板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: summary strip and reviewed brief on top, one ruled ledger table, team flow at the foot */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#14213d; --muted:#5b6478; --line:#dfe3ea;
  --accent:#e0a100; --accent-ink:#5a4100;
  --red:#c42b1c; --red-bg:#fbe9e7; --amber:#a35f00; --amber-bg:#fdf1dc; --green:#1f7a4d; --green-bg:#e4f4ea;
  --bar:#b9c1d0;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --panel:#161d2c; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2a3346;
  --accent:#f2b51d; --accent-ink:#1b1400;
  --red:#ff7a6b; --red-bg:#3a1a19; --amber:#f0b45a; --amber-bg:#36290f; --green:#6fd3a0; --green-bg:#12301f; --bar:#3c475d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --panel:#161d2c; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2a3346;
  --accent:#f2b51d; --accent-ink:#1b1400;
  --red:#ff7a6b; --red-bg:#3a1a19; --amber:#f0b45a; --amber-bg:#36290f; --green:#6fd3a0; --green-bg:#12301f; --bar:#3c475d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:920px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{margin:0;font-size:clamp(24px,5vw,34px);font-weight:900;text-wrap:balance}
.weeks{font-family:var(--mono);font-size:13px;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--panel);border:1px solid var(--line)}
.chip b{font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:8px}
.brief-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.brief h2{margin:0;font-size:16px}
.brief p{margin:0;font-size:14.5px;line-height:1.75;max-width:70ch}
.review{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.review.fail{background:var(--red-bg);color:var(--red)}
.issues{margin:0;padding-left:18px;font-size:13px;color:var(--red)}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:600px;font-variant-numeric:tabular-nums}
thead th{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;text-align:left;padding:10px 12px}
thead th.num{text-align:right}
tbody tr.main{border-top:1px solid var(--line)}
tbody tr.main.has-days{cursor:pointer}
tbody tr.main.has-days:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
tbody tr.main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td{padding:11px 12px;vertical-align:top;font-size:14px}
td.name{border-left:4px solid transparent;min-width:150px}
tr.lv-red td.name{border-left-color:var(--red)}
tr.lv-amber td.name{border-left-color:var(--amber)}
.nm{font-weight:700}
.more{font-size:11px;color:var(--muted);margin-left:4px}
td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.delta{display:block;font-size:11.5px}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:700}
.t-red{background:var(--red-bg);color:var(--red)}
.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-none{color:var(--muted);padding-left:0;font-weight:500}
.rule{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.cmt{display:block;font-size:12.5px;margin-top:5px;line-height:1.5;min-width:190px}
tr.detail td{padding:0 12px 14px 16px;background:color-mix(in srgb,var(--line) 30%,transparent)}
.days{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;align-items:center}
.days .lbl{font-size:11.5px;color:var(--muted);width:30px}
.day{font-family:var(--mono);font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.day i{font-style:normal;color:var(--muted);margin-right:6px}
.day.hi{border-color:var(--red);color:var(--red)}
.flow{display:grid;gap:10px;font-size:13px;color:var(--muted)}
.flow h2{font-size:14px;color:var(--fg);margin:0}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.step b{display:block;font-size:12.5px}
.step span{font-size:11.5px;color:var(--muted)}
.arrow{color:var(--muted)}
.state{padding:40px 0;text-align:center;color:var(--muted)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;justify-content:space-between}
.sec-head h2{margin:0;font-size:18px;font-weight:900}
.sec-head span{font-size:12.5px;color:var(--muted)}
.spark{display:block;margin-top:6px}
.spark .b{fill:var(--bar)}
.spark .b.now{fill:var(--fg)}
.spark .avg{stroke:var(--accent);stroke-width:1.5}
.ratio{display:block;font-size:11.5px;color:var(--muted)}
.ratio.hi{color:var(--amber);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;vertical-align:middle;margin-right:4px;border-radius:2px}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">第一部分 全球動態 · 全球金融風險看板</div>
    <h1>全球金融風險看板</h1>
    <div class="weeks" id="weeks">載入本週資料中…</div>
  </header>
  <div id="app" hidden>
    <div class="wrap" style="max-width:none">
      <div class="summary" id="summary"></div>
      <section class="brief" aria-labelledby="brief-h">
        <div class="brief-head"><h2 id="brief-h">本週總評</h2><span class="review" id="review"></span></div>
        <p id="brief"></p>
        <ul class="issues" id="issues" hidden></ul>
      </section>
      <div class="sec-head"><h2>美元流動性</h2><span>上週 vs 本週 · 依警示門檻標色 · 資料來源 FRED</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>指標</th><th class="num">上週</th><th class="num">本週</th><th>警示與判讀</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <section id="vol" class="wrap" style="max-width:none;gap:12px" hidden>
        <div class="sec-head"><h2>波動率</h2><span id="vol-sub"></span></div>
        <div class="legend"><span><i style="background:var(--bar)"></i>過去 13 週</span><span><i style="background:var(--fg)"></i>本週</span><span><i style="background:var(--accent);height:2px"></i>13 週均值</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>指標</th><th class="num">上週</th><th class="num">本週</th><th class="num">13 週均值</th><th>13 週走勢與判讀</th></tr></thead>
            <tbody id="vrows"></tbody>
          </table>
        </div>
      </section>
      <section class="flow">
        <h2>本週產出流程</h2>
        <div class="steps">
          <div class="step"><b>資料員</b><span>程式下載 FRED 原始資料並計算</span></div><span class="arrow">→</span>
          <div class="step"><b>分析師</b><span>依數字寫判讀</span></div><span class="arrow">→</span>
          <div class="step"><b>審核員</b><span>逐句驗算核對</span></div><span class="arrow">→</span>
          <div class="step"><b>主管</b><span>審核通過後發布</span></div>
        </div>
        <div id="gen"></div>
      </section>
    </div>
  </div>
  <div class="state" id="state">正在讀取 data.json…</div>
</div>

<script>
const RED=["心絞痛","稀缺區"];
const dec=v=>{const s=String(v);return s.includes(".")?Math.min(s.split(".")[1].length,5):0};
const fmt=(v,d)=>v==null?"—":Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(D){
  document.getElementById("weeks").textContent=`上週 ${D.last_week}　｜　本週 ${D.this_week}　｜　最新資料日 ${D.latest_data}`;
  document.getElementById("brief").textContent=D.summary;
  const rv=document.getElementById("review"),R=D.review,ok=R.verdict==="通過";
  rv.textContent=ok?`審核通過（第 ${R.rounds} 輪）`:`審核未通過（${R.rounds} 輪）`;
  if(!ok){rv.classList.add("fail");const ul=document.getElementById("issues");ul.hidden=false;
    ul.innerHTML=R.issues.map(i=>`<li>${esc(i.name)}：${esc(i.problem)}</li>`).join("");}
  document.getElementById("gen").textContent=`產生時間：${D.generated_at}。第一輪審核挑出 ${R.first_round_issues} 個問題。`;
  const counts={red:0,amber:0}, tb=document.getElementById("rows");
  D.rows.forEach(r=>{
    const d=Math.max(dec(r.last),dec(r.this));
    const lv=r.alert?(RED.includes(r.alert)?"red":"amber"):"none"; if(lv!=="none")counts[lv]++;
    const cls=r.trend.includes("上升")?"up":r.trend.includes("下降")?"down":"flat";
    const diff=(r.last!=null&&r.this!=null&&cls!=="flat")?(r.this>r.last?"▲ ":"▼ ")+fmt(Math.abs(r.this-r.last),d):"—";
    const days=D.daily?.[r.name];
    const tr=document.createElement("tr"); tr.className="main lv-"+lv+(days?" has-days":"");
    tr.innerHTML=`<td class="name"><span class="nm">${esc(r.name)}</span>${days?'<span class="more">每日 ▾</span>':''}</td>
      <td class="num">${fmt(r.last,d)}</td>
      <td class="num">${fmt(r.this,d)}<span class="delta ${cls}">${diff}</span></td>
      <td><span class="tag t-${lv}">${esc(r.alert||r.trend)}</span>${r.note?`<span class="rule">${esc(r.note)}</span>`:''}<span class="cmt">${esc(r.comment)}</span></td>`;
    tb.appendChild(tr);
    if(days){
      tr.tabIndex=0;
      const det=document.createElement("tr");det.className="detail";det.hidden=true;
      const blk=(lbl,o)=>{const vs=Object.values(o);if(!vs.length)return"";const m=Math.max(...vs);
        return `<div class="days"><span class="lbl">${lbl}</span>${Object.entries(o).map(([k,v])=>`<span class="day${v===m&&vs.length>2&&m>0?' hi':''}"><i>${k}</i>${fmt(v,d)}</span>`).join("")}</div>`;};
      det.innerHTML=`<td colspan="4">${blk("上週",days.last)}${blk("本週",days.this)}</td>`;
      tb.appendChild(det);
      const t=()=>{det.hidden=!det.hidden};
      tr.addEventListener("click",t);
      tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
    }
  });
  const S=document.getElementById("summary");
  [["red","紅色警示",counts.red],["amber","需留意",counts.amber],["green","無警示",D.rows.length-counts.red-counts.amber]]
    .forEach(([k,t,n])=>S.insertAdjacentHTML("beforeend",`<span class="chip"><span class="dot" style="background:var(--${k})"></span>${t} <b>${n}</b></span>`));
  if(D.volatility) renderVol(D.volatility);
  document.getElementById("state").hidden=true; document.getElementById("app").hidden=false;
}
function spark(weeks,avg){
  const vs=Object.values(weeks), n=vs.length, W=168, H=34, pad=2;
  const top=Math.max(...vs,avg)*1.08||1, bw=(W-pad*2)/n;
  const y=v=>H-(v/top)*H;
  const bars=vs.map((v,i)=>`<rect class="b${i===n-1?' now':''}" x="${(pad+i*bw+1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H-y(v)).toFixed(1)}" rx="1"></rect>`).join("");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="13 週走勢">${bars}<line class="avg" x1="0" x2="${W}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}"></line></svg>`;
}
function renderVol(V){
  const sec=document.getElementById("vol"), tb=document.getElementById("vrows");
  const above=V.rows.filter(r=>r.alert).length;
  document.getElementById("vol-sub").textContent=`和自己過去 ${V.avg_weeks} 週平均比較 · ${above} / ${V.rows.length} 項高於均值 · ${V.source}`;
  V.rows.forEach(r=>{
    const d=Math.max(dec(r.last),dec(r.this),dec(r.avg13));
    const cls=r.trend.includes("上升")?"up":r.trend.includes("下降")?"down":"flat";
    const tr=document.createElement("tr"); tr.className="main"+(r.alert?" lv-amber":"");
    tr.innerHTML=`<td class="name"><span class="nm">${esc(r.name)}</span><span class="rule">${esc(r.kind)}</span></td>
      <td class="num">${fmt(r.last,d)}</td>
      <td class="num">${fmt(r.this,d)}<span class="delta ${cls}">${esc(r.trend)}</span></td>
      <td class="num">${fmt(r.avg13,d)}<span class="ratio${r.alert?' hi':''}">× ${fmt(r.ratio,2)}</span></td>
      <td><span class="tag t-${r.alert?'amber':'none'}">${r.alert?esc(r.alert):'小於13週均值'}</span>${spark(r.weeks,r.avg13)}<span class="cmt">${esc(r.comment)}</span></td>`;
    tb.appendChild(tr);
  });
  sec.hidden=false;
}
fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render)
  .catch(()=>{document.getElementById("state").textContent="讀不到本週資料（data.json）。請重新整理，或請 Claude 重新發布。";
    document.getElementById("weeks").textContent="";});
</script>
